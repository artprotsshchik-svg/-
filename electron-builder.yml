appId: com.modpack.workbench
productName: VerstakSborok
directories:
  output: release
files:
  - dist/**/*
  - electron/**/*
  - package.json
win:
  target:
    - target: portable
      arch:
        - x64
    - target: nsis
      arch:
        - x64
portable:
  artifactName: Verstak-Sborok-${version}-portable.exe
nsis:
  artifactName: Verstak-Sborok-${version}-setup.exe
  oneClick: false
  allowToChangeInstallationDirectory: true
